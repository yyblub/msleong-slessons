<title>Ms Leong’s Lessons</title>

<style id="hubStyle">/* Layout: a classroom pinboard. A big name banner, the warm-up gacha, then one large card per resource. */
:root{
  --paper:#F6F6F2;
  --card:#FFFFFF;
  --ink:#16182B;
  --muted:#565A70;
  --line:#DCDCE4;
  --accent:#2340B8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4E8FA;
  --pin:#D7322B;
  --good:#23794B;
  --good-ink:#FFFFFF;
  --gold:#F4C430;
  --gold-2:#F9DC7A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11121A; --card:#1A1C27; --ink:#ECEDF5; --muted:#A4A7BB; --line:#2C2E3F;
    --accent:#8C9DFF; --accent-ink:#0E1020; --accent-soft:#252B4D; --pin:#FF7A6E; --good:#5CC48A; --good-ink:#0E1020; --gold:#F4C430; --gold-2:#C99A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11121A; --card:#1A1C27; --ink:#ECEDF5; --muted:#A4A7BB; --line:#2C2E3F;
  --accent:#8C9DFF; --accent-ink:#0E1020; --accent-soft:#252B4D; --pin:#FF7A6E; --good:#5CC48A; --good-ink:#0E1020; --gold:#F4C430; --gold-2:#C99A12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px 56px;display:grid;gap:48px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

header.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 32px;align-items:center}
header.banner h1{font-size:clamp(44px,8vw,88px);font-weight:800;letter-spacing:-.03em}
header.banner p{color:var(--muted);font-size:18px;max-width:52ch;margin-top:12px}
.menu{display:grid;gap:10px;width:min(400px,100%)}
.menu a{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.menu a:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.menu a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.menu svg{width:48px;height:48px;display:block}
.menu b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.15}
.menu small{display:block;color:var(--muted);font-size:14px;margin-top:2px}

.resources{display:grid;gap:18px}
.res{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.res .art{background:var(--accent-soft);display:grid;place-items:center;padding:20px}
.res .art svg{width:100%;max-width:240px;height:auto;display:block}
.res .body{padding:clamp(18px,3vw,28px);display:grid;gap:12px;align-content:start;min-width:0}
.res h3{font-size:clamp(28px,3.6vw,38px);font-weight:800;letter-spacing:-.015em}
.res p{max-width:60ch}
.res ul{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--muted);font-size:15.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.open{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 20px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}

footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14.5px}

/* ---------- sketch gacha ---------- */
.gacha{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:clamp(18px,3.5vw,32px);display:grid;gap:22px}
.gacha:fullscreen{border:0;border-radius:0;overflow:auto;align-content:center;padding:max(24px,4vw)}
.g-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:start}
.g-head > div{display:grid;gap:8px;max-width:62ch}
.g-head h2{font-size:clamp(32px,4.6vw,48px);font-weight:800;letter-spacing:-.02em}
.g-head p{color:var(--muted)}
.g-body{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:clamp(18px,4vw,40px);align-items:center}
.shelf{display:grid;gap:12px;justify-items:center}
.boxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;width:100%;max-width:330px;padding-bottom:10px;border-bottom:6px solid var(--ink)}
.mbox{background:none;border:0;padding:0;cursor:pointer;border-radius:10px;transition:opacity .3s,transform .15s}
.mbox:hover:not(:disabled){transform:translateY(-4px)}
.mbox:disabled{cursor:default}
.mbox svg{width:100%;height:auto;display:block;overflow:visible}
.mbox .lid{transform-box:fill-box;transform-origin:20% 100%;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .6s .5s}
.mbox .crack{opacity:0;transition:opacity .2s}
.mbox.cracked .crack{opacity:1}
.mbox.open .crack{opacity:0}
.mbox .burst{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.3);transition:opacity .4s,transform .8s cubic-bezier(.2,1.6,.4,1)}
.mbox.shake svg{animation:bshake .38s ease-in-out 4;transform-origin:50% 95%}
@keyframes bshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.mbox.open .lid{transform:translate(18px,-50px) rotate(34deg);opacity:0}
.mbox.open .burst{opacity:1;transform:scale(1)}
.mbox.dim{opacity:.3}
.shelf-note{font-size:15px;color:var(--muted);text-align:center}
.again{font-family:var(--f-display);font-size:18px;font-weight:800;padding:11px 22px;border-radius:999px;border:0;background:var(--pin);color:#fff;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb, var(--pin) 60%, #000)}
.again:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--pin) 60%, #000)}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cap{border-radius:18px;padding:18px 20px;display:grid;gap:8px;align-content:start;border:2.5px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;min-height:220px}
.cap::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:var(--cap)}
.cap.topic{--cap:#F4C430}
.cap.focus{--cap:var(--kind,#2340B8)}
.cap-label{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:6px}
.cap strong{font-family:var(--f-display);font-size:clamp(26px,3.2vw,40px);line-height:1.05;letter-spacing:-.01em;overflow-wrap:break-word;hyphens:auto}
.cap-note{font-size:16px}
.kind-chip{justify-self:start;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--kind,#2340B8);color:#fff}
.swap{justify-self:start;margin-top:auto;font:inherit;font-size:14.5px;font-weight:700;background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.swap:hover{border-color:var(--ink)}
.cap.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.cap.focus.pop{animation-delay:0s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.g-tools{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.pools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:15.5px}
.pools label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700}
.pools input{width:18px;height:18px;accent-color:var(--accent)}
.g-side{display:grid;gap:12px;justify-items:end;align-content:start}
.timer-card{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.tc-top{display:flex;align-items:center;gap:10px}
.tc-btns{display:flex;gap:8px}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.go-label{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--pin);opacity:0;white-space:nowrap}
.go-label.show{animation:gopop 2.8s ease-out both}
@keyframes gopop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}12%{opacity:1;transform:scale(1.12) rotate(3deg)}22%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0}}
.alarm{width:44px;height:44px;flex:none;color:var(--ink)}
.timer-card.ringing .alarm{animation:ring .14s linear infinite}
/* while counting down: the alarm clock rocks like a ticking clock and the numbers pulse once a second */
.timer-card.running .alarm{animation:tock 1s ease-in-out infinite;transform-origin:50% 60%}
.timer-card.running .clock{animation:beat 1s ease-out infinite}
.timer-card.kick .tc-top{animation:kick .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes tock{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes beat{0%{transform:scale(1.08)}35%,100%{transform:scale(1)}}
@keyframes kick{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.12)}60%{transform:translateY(2px) scale(.97)}100%{transform:none}}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.timer-card .clock{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,52px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center;line-height:1}
.timer-card .clock.done{color:var(--pin)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:14.5px;font-weight:700;border:0;background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tbtn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:7px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.tbtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gacha.big .cap strong{font-size:clamp(40px,6vw,72px)}
.gacha.big .cap-note{font-size:20px}
.gacha.big .cap{min-height:300px}
@media (prefers-reduced-motion: reduce){ .go-label.show{animation:none;opacity:1} .timer-card.running .alarm,.timer-card.running .clock,.timer-card.kick .tc-top,.timer-card.ringing .alarm,.mbox.shake svg,.cap.pop{animation:none} .mbox .lid,.mbox .burst{transition:none} }

@media (max-width: 760px){
  header.banner{grid-template-columns:minmax(0,1fr)}

  .g-body{grid-template-columns:minmax(0,1fr)}
  .g-head{grid-template-columns:minmax(0,1fr)}
  .g-side{justify-items:start}
  .results{grid-template-columns:minmax(0,1fr)}
  .cap{min-height:0}
  .res{grid-template-columns:minmax(0,1fr)}
  .res .art{padding:16px}
  .res .art svg{max-width:200px}
}
/* ---------- angry hamster meme: glitches in when the timer starts, bangs its pan, glitches out ---------- */
.meme{position:fixed;left:50%;top:50%;z-index:50;pointer-events:none;width:min(340px,80vw);transform:translate(-50%,-50%)}
.meme-card{position:relative;background:#fff;border:4px solid #16182B;border-radius:14px;padding:14px 14px 10px;box-shadow:0 18px 40px -10px rgba(0,0,0,.45);
  filter:drop-shadow(4px 0 0 rgba(255,0,70,.75)) drop-shadow(-4px 0 0 rgba(0,210,255,.75));overflow:hidden}
.meme-card::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.10) 3px 4px);pointer-events:none}
.meme-cap{font-family:Impact,"Bricolage Grotesque","Arial Black",sans-serif;font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1;text-align:center;text-transform:uppercase;color:#fff;
  -webkit-text-stroke:2px #16182B;paint-order:stroke fill;text-shadow:0 3px 0 #16182B;letter-spacing:.02em}
.meme svg{display:block;width:100%;height:auto}
.meme.play .meme-card{animation:glitchIn .4s steps(1) both, jitter .14s steps(2) .4s 13, glitchOut .45s steps(1) 2.25s forwards}
.meme .m-stick{transform-box:view-box;transform-origin:88px 64px}
.meme .m-pan{transform-box:view-box;transform-origin:34px 40px}
.meme .m-clang{opacity:0}
.meme.play .m-stick{animation:whack .36s ease-in .4s 5}
.meme.play .m-pan{animation:panwob .36s .4s 5}
.meme.play .m-clang{animation:flash .36s .4s 5}
@keyframes glitchIn{0%{opacity:0;transform:scale(.6) skewX(25deg);clip-path:inset(40% 0 45% 0)}20%{opacity:1;transform:translateX(16px) scale(1.06) skewX(-12deg);clip-path:inset(8% 0 62% 0)}40%{transform:translateX(-14px) scale(.97);clip-path:inset(55% 0 4% 0)}60%{transform:translateX(8px);clip-path:inset(0 0 35% 0)}80%{transform:skewX(5deg);clip-path:inset(22% 0 0 0)}100%{opacity:1;transform:none;clip-path:inset(0)}}
@keyframes jitter{0%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}
@keyframes glitchOut{0%{opacity:1;transform:none;clip-path:inset(0)}20%{transform:translateX(-14px) skewX(10deg);clip-path:inset(30% 0 20% 0)}40%{transform:translateX(18px) scale(1.04);clip-path:inset(0 0 70% 0)}60%{transform:translateX(-6px) scaleY(.4);clip-path:inset(60% 0 10% 0)}80%{opacity:1;transform:scaleY(.08) scaleX(1.2);clip-path:inset(45% 0 45% 0)}100%{opacity:0;transform:scaleY(0);clip-path:inset(50% 0 50% 0)}}
@keyframes whack{0%{transform:rotate(0)}45%,55%{transform:rotate(-62deg)}100%{transform:rotate(0)}}
@keyframes panwob{0%,42%{transform:rotate(0)}52%{transform:rotate(-10deg)}72%{transform:rotate(5deg)}100%{transform:rotate(0)}}
@keyframes flash{0%,42%{opacity:0}50%{opacity:1}85%,100%{opacity:0}}
/* time's up: the hamster cheers up and dances */
.meme .m-happy,.meme .m-notes{display:none}
.meme.dance .m-happy,.meme.dance .m-notes{display:inline}
.meme.dance .m-frown,.meme.dance .m-brows,.meme.dance .m-anger,.meme.dance .m-clang{display:none}
.meme.dance .meme-card{animation:glitchIn .4s steps(1) both, glitchOut .45s steps(1) 3.95s forwards}
.meme.dance svg{transform-origin:50% 95%;animation:dance .5s ease-in-out .4s 7}
.meme.dance .m-stick{animation:wave .5s ease-in-out .4s 7}
.meme.dance .m-pan{animation:wave2 .5s ease-in-out .4s 7}
.meme.dance .m-notes text{animation:note 1s ease-out .4s 4;opacity:0}
.meme.dance .m-notes .n2{animation-delay:.7s}.meme.dance .m-notes .n3{animation-delay:1s}
@keyframes dance{0%,100%{transform:rotate(-9deg) translateY(0)}25%,75%{transform:rotate(0) translateY(-12px)}50%{transform:rotate(9deg) translateY(0)}}
@keyframes wave{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(18deg)}}
@keyframes wave2{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
@media (prefers-reduced-motion: reduce){ .meme.dance .meme-card{animation:fadeMeme 4.4s both} .meme.dance svg,.meme.dance .m-stick,.meme.dance .m-pan,.meme.dance .m-notes text{animation:none} .meme.dance .m-notes text{opacity:1} }
@media (prefers-reduced-motion: reduce){ .meme.play .meme-card{animation:fadeMeme 2.7s both} .meme.play .m-stick,.meme.play .m-pan,.meme.play .m-clang{animation:none} @keyframes fadeMeme{0%,100%{opacity:0}10%,85%{opacity:1}} }

/* ---------- this week's slides + our Padlets ---------- */
.slides{display:grid;gap:22px}
.s-head{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:flex-end}
.s-head > div{display:grid;gap:8px;max-width:60ch}
.s-head h2{font-size:clamp(32px,4.6vw,48px);font-weight:800;letter-spacing:-.02em}
.s-head p{color:var(--muted)}
.s-search{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.s-search input,.s-search select,.tform input,.tform select,.tform textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.s-search input{width:min(260px,70vw)}
.s-search input:focus-visible,.s-search select:focus-visible,.tform :is(input,select,textarea):focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.this-week{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 22px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:clamp(16px,3vw,26px)}
.this-week .wk{font-family:var(--f-display);font-weight:800;line-height:.9;text-align:center}
.this-week .wk small{display:block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.this-week .wk span{font-size:clamp(48px,7vw,72px)}
.this-week h3{font-size:clamp(24px,3.2vw,34px);font-weight:800}
.this-week p{opacity:.9;margin-top:4px}
.this-week .open .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.slide-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.scard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.scard .chip{justify-self:start;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--ink);color:var(--paper)}
.scard h3{font-size:20px;font-weight:800}
.scard p{font-size:15px;color:var(--muted)}
.scard .open{margin-top:2px}
.scard .btn{padding:7px 14px;font-size:15px}
.empty{color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.padlets{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.padlets h3{font-size:clamp(24px,3vw,30px);font-weight:800}
.p-head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
.p-head > div{display:grid;gap:6px;max-width:60ch}
.p-head p{color:var(--muted)}
.padlet-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.pcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.pcard .av{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff}
.pcard b{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.pcard span{font-size:14px;color:var(--muted)}
.pcard .row{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  const t0 = a.currentTime + t, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = nbuf; f.type = o.type; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f, t0);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  env(g, t0, o.gain, o.attack || .004, dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0, Math.random()*.5); src.stop(t0 + dur + .05);
}
function tone(t, dur, f1, f2, peak){
  const a = audio(); if (!a || !soundOn) return;
  const t0 = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  env(g, t0, peak, .005, dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}
const sfx = {
  tap(t){ noise(t, .08, {type:'lowpass', f:650, gain:.5}); tone(t, .09, 150, 85, .22); },          /* cardboard knock */
  shake(){ [0, .13, .26, .39, .52].forEach(t => sfx.tap(t)); },
  tape(t){ for (let i = 0; i < 16; i++) noise(t + i*.021 + Math.random()*.008, .028, {type:'bandpass', f:2000 + Math.random()*2600, q:2.2, gain:.16}); }, /* tape peeling */
  pop(t){ tone(t, .18, 230, 68, .42); noise(t, .05, {type:'highpass', f:1600, gain:.18}); },          /* lid pops off */
  rustle(t){ for (let i = 0; i < 9; i++) noise(t + i*.045, .09, {type:'highpass', f:2600 + Math.random()*2600, gain:.05 + Math.random()*.05}); }, /* tissue paper */
  sparkle(t){ [1568, 2093, 2637].forEach((f, i) => tone(t + i*.07, .3, f, f*1.01, .045)); },
  crack(t){ for (let i = 0; i < 6; i++) noise(t + i*.035 + Math.random()*.015, .025, {type:'bandpass', f:3200 + Math.random()*2500, q:3, gain:.28}); tone(t, .05, 1900, 1200, .06); },  /* eggshell cracking */

};

function chime(){ try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach((t, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = [660, 784, 988][i]; g.gain.setValueAtTime(.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, ac.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t + .4); o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .45); }); } catch (e) {} }

/* gentle music-box ringtone when the timer starts: a soft rising tune, each note a quiet bell that fades */
function startSound(){
  const a = audio(); if (!a || !soundOn) return;
  const notes = [[0,659.3],[.2,784],[.4,1046.5],[.6,1318.5],[.85,1174.7],[1.1,1046.5]];
  notes.forEach(([t, hz], i) => {

    [[hz, .09, 'sine'], [hz*2, .025, 'sine'], [hz*3, .01, 'triangle']].forEach(([f, peak, type]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + len + .05);

/* angry hamster meme on Start: glitch in, five pan bangs, glitch out */
function clang(t){
  const a = audio(); if (!a || !soundOn) return;
  const t0 = a.currentTime + t;
  [[620,.11],[1711,.06],[3348,.035],[5537,.018]].forEach(([f, peak]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f*1.012, t0); o.frequency.exponentialRampToValueAtTime(f, t0 + .05);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + .003); g.gain.exponentialRampToValueAtTime(.0001, t0 + .55);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .6);
  });
  noise(t, .05, {type:'highpass', f:2500, gain:.1});
}
function glitchSound(t){
  noise(t, .16, {type:'bandpass', f:1400, q:.8, gain:.09});
  const a = audio(); if (!a || !soundOn) return;
  const t0 = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(900, t0); o.frequency.setValueAtTime(300, t0 + .05); o.frequency.setValueAtTime(1300, t0 + .1);
  g.gain.setValueAtTime(.04, t0); g.gain.setValueAtTime(.0001, t0 + .15);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .16);

/* time's up: a bouncy little tune while the hamster dances (two beats per second, matching the dance) */
function danceTune(){
  const a = audio(); if (!a || !soundOn) return;
  const N = {C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784,A5:880,C6:1046.5,C3:130.8,F3:174.6,G3:196};

  const bass = [['C3',0],['C3',.5],['F3',1],['F3',1.5],['G3',2],['G3',2.5],['C3',3],['C3',3.25]];

    o.type = type; o.frequency.value = hz; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + len + .05); };
  tune.forEach(([n, t], i) => play(N[n], t, i === tune.length - 1 ? .7 : .22, 'triangle', .1));

/* saving: rebuild the page with the new data and publish it; every open view then reloads to it */
async function save(statusEl, change){
  if (!ART) return;
  const before = JSON.stringify(DATA);
  change(DATA);
  statusEl.className = 'status'; statusEl.textContent = 'Saving…';
  try { sessionStorage.setItem('hub:scrollTo', {slideStatus: 'slides', questStatus: 'quest'}[statusEl.id] || 'padletList'); } catch (e) {}
  try { await ART.publish(buildHtml(DATA)); statusEl.textContent = 'Saved. The page is updating…'; }
  catch (e) {
    DATA = JSON.parse(before); renderSlides(); renderPadlets(); renderQuest(); renderStop();
    const code = e && e.code;
    if (code === 'conflict') statusEl.textContent = 'This page changed somewhere else. It’s reloading with the newest version, so add it again after that.';
    else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared') { statusEl.textContent = 'Saving isn’t available in this view.'; }
    else if (code === 'rate_limited') statusEl.textContent = 'Saving too quickly. Wait a moment, then try again.';
    else statusEl.textContent = 'Couldn’t save just now. Try again in a moment.';
    statusEl.classList.add('err');
  }
}

}

/* ---------- in-page slide viewer ----------
   Uploaded files only open inside this page, so PDFs are drawn here with PDF.js (loaded on first use). */
let pdfLib = null, vDoc = null, vPage = 1, vLast = null;
function loadScript(src){ return new Promise((ok, no) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = no; document.head.appendChild(t); }); }
async function pdfjs(){
  if (pdfLib) return pdfLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
  await loadScript(base + 'pdf.worker.min.js');   /* runs PDF.js on the page itself (no separate worker needed) */
  await loadScript(base + 'pdf.min.js');
  pdfLib = window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  return pdfLib;
}
function vMsg(t){ $('#vMsg').textContent = t; $('#vMsg').hidden = !t; }
async function drawPage(){
  if (!vDoc) return;
  const page = await vDoc.getPage(vPage), stage = $('#vStage');
  const base = page.getViewport({scale: 1}), fit = Math.min((stage.clientWidth - 32) / base.width, (stage.clientHeight - 16) / base.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), vp = page.getViewport({scale: fit * dpr}), c = $('#vCanvas');
  c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + 'px'; c.style.height = (vp.height / dpr) + 'px';
  await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
  $('#vPage').textContent = `Slide ${vPage} of ${vDoc.numPages}`;
  $('#vPrev').disabled = vPage <= 1; $('#vNext').disabled = vPage >= vDoc.numPages;
}
async function openViewer(id, kind, title, opener){
  vLast = opener; vDoc = null; vPage = 1;
  $('#vTitle').textContent = title; $('#vPage').textContent = ''; $('#viewer').hidden = false; document.body.style.overflow = 'hidden';
  $('#vCanvas').hidden = true; $('#vImg').hidden = true; $('#vPrev').hidden = $('#vNext').hidden = kind !== 'pdf';
  vMsg('Opening the slides…'); $('#vClose').focus();
  try {
    if (kind === 'img'){ const img = $('#vImg'); img.alt = title; img.src = '/_blob/' + id; await img.decode(); img.hidden = false; vMsg(''); return; }
    const res = await fetch('/_blob/' + id); if (!res.ok) throw new Error('fetch ' + res.status);
    const lib = await pdfjs(); vDoc = await lib.getDocument({data: new Uint8Array(await res.arrayBuffer())}).promise;
    $('#vCanvas').hidden = false; vMsg(''); await drawPage();
  } catch (e) { vMsg('These slides couldn’t be opened here. Ask Ms Leong for a link to the slides.'); }
}
function closeViewer(){ $('#viewer').hidden = true; document.body.style.overflow = ''; vDoc = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); if (vLast && vLast.isConnected) vLast.focus(); }
document.addEventListener('click', e => { const b = e.target.closest('[data-view-file]'); if (b) openViewer(b.dataset.viewFile, b.dataset.kind, b.dataset.title, b); });
$('#vClose').addEventListener('click', closeViewer);
$('#vPrev').addEventListener('click', () => { if (vDoc && vPage > 1){ vPage--; drawPage(); } });
$('#vNext').addEventListener('click', () => { if (vDoc && vPage < vDoc.numPages){ vPage++; drawPage(); } });
$('#vFull').addEventListener('click', async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await $('#viewer').requestFullscreen(); } catch (e) {} });
document.addEventListener('fullscreenchange', () => { $('#vFull').textContent = document.fullscreenElement === $('#viewer') ? 'Exit full screen' : 'Full screen'; if (!$('#viewer').hidden) setTimeout(drawPage, 80); });
window.addEventListener('resize', () => { if (!$('#viewer').hidden && vDoc) drawPage(); });
document.addEventListener('keydown', e => {
  if ($('#viewer').hidden) return;
  if (e.key === 'Escape' && !document.fullscreenElement) closeViewer();
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); $('#vNext').click(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); $('#vPrev').click(); }
});

});
$('#qReplay').addEventListener('click', () => openEnding());

/* the ending: confetti, a crowned dancing hamster and a certificate */
let endFrom = null, confettiRun = 0;
function paintCert(){
  const {q} = standing(), skills = q.stops.reduce((c, s) => c + s.goals.filter((g, i) => (QP.r[s.id] || [])[i] === 3).length, 0);
  $('#certName').textContent = (QP.name || '').trim() || 'Your name here';
  $('#certLine').textContent = `has reached the rank of ${q.ranks[q.ranks.length - 1]} in ${q.title || 'Art Quest'}`;
  $('#certMeta').textContent = `${skills} skills mastered · ${new Date().toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'})}`;
}
function confetti(){
  if (reduce) return;
  const c = $('#confetti'), x = c.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2), W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const cols = ['#F4C430','#EC86AE','#2E8B57','#6E93BF','#EE7A22','#B79AE0','#D7322B'];
  const ps = Array.from({length: 180}, () => ({x: Math.random() * W, y: -Math.random() * H * .7, vx: (Math.random() - .5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, r: Math.random() * 6.3, vr: (Math.random() - .5) * .3, s: (7 + Math.random() * 8) * dpr, c: cols[Math.random() * cols.length | 0]}));
  const t0 = performance.now(); cancelAnimationFrame(confettiRun);
  const step = now => {
    x.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx + Math.sin(now / 300 + p.r) * .6; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (now - t0 < 6500 && !$('#ending').hidden) confettiRun = requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  };
  confettiRun = requestAnimationFrame(step);
}
function celebrate(){
  const h = $('#endHam'); h.classList.remove('dance'); void h.offsetWidth; h.classList.add('dance');
  confetti(); levelSound(); setTimeout(danceTune, 500);
}
function openEnding(){
  const {q} = standing();
  if (!$('#endHam').firstChild){
    const svg = $('#meme svg').cloneNode(true);
    svg.insertAdjacentHTML('beforeend', '<path d="M56 47 L57 31 L65 39 L72 27 L79 39 L87 31 L88 47 Z" fill="#F4C430" stroke="#16182B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="72" cy="40" r="3" fill="#D7322B"/>');
    $('#endHam').appendChild(svg);
  }
  endFrom = document.activeElement;
  $('#endH').textContent = q.ranks[q.ranks.length - 1] + '!';
  $('#endMsg').textContent = q.ending || DEFAULT_QUEST.ending;
  $('#certInput').value = QP.name || ''; paintCert();
  $('#ending').hidden = false; document.body.style.overflow = 'hidden'; $('#endClose').focus();
  celebrate();
}
function closeEnding(){ $('#ending').hidden = true; document.body.style.overflow = ''; cancelAnimationFrame(confettiRun); if (endFrom && endFrom.isConnected) endFrom.focus(); }
$('#endClose').addEventListener('click', closeEnding);
$('#endAgain').addEventListener('click', celebrate);
$('#certInput').addEventListener('input', e => { QP.name = e.target.value.slice(0, 30); qSave(); paintCert(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ending').hidden) closeEnding(); });

/* teacher: edit the roadmap. Changes collect in a draft and are published together with "Save roadmap". */
let QDRAFT = null;
function renderQuestEditor(){
  if (!TEACHER){ QDRAFT = null; $('#qtStops').innerHTML = ''; return; }
  if (!QDRAFT){
    const q = quest();
    QDRAFT = JSON.parse(JSON.stringify({current: q.stops[q.nowIdx].id, stops: q.stops}));
    $('#qtTitle').value = q.title || ''; $('#qtRanks').value = q.ranks.join(', '); $('#qtEnding').value = q.ending || '';
  }
  const S = QDRAFT.stops;
  $('#qtStops').innerHTML = S.map((s, i) => `<fieldset class="tform qt-stop" data-i="${i}"><legend>Lesson ${i + 1}</legend>
    <label for="qtw-${esc(s.id)}">Week<input id="qtw-${esc(s.id)}" data-f="week" type="number" min="1" max="60" value="${esc(s.week)}"></label>
    <label for="qtt-${esc(s.id)}">Lesson title<input id="qtt-${esc(s.id)}" data-f="title" type="text" maxlength="60" value="${esc(s.title)}" placeholder="e.g. Value and form"></label>
    <label for="qtl-${esc(s.id)}">Link to practise (optional)<input id="qtl-${esc(s.id)}" data-f="link" type="url" value="${esc(s.link || '')}" placeholder="https://…"></label>
    <label for="qtg-${esc(s.id)}" class="wide">Skills, one per line<textarea id="qtg-${esc(s.id)}" data-f="goals" placeholder="I can …">${esc((Array.isArray(s.goals) ? s.goals : []).join('\n'))}</textarea></label>
    <div class="qt-row wide"><label class="now-pick" for="qtn-${esc(s.id)}"><input type="radio" name="qtNow" id="qtn-${esc(s.id)}" value="${esc(s.id)}"${QDRAFT.current === s.id ? ' checked' : ''}>The class is on this lesson</label>
    <button class="rm" type="button" data-qt="up"${i ? '' : ' disabled'}>Move up</button><button class="rm" type="button" data-qt="down"${i < S.length - 1 ? '' : ' disabled'}>Move down</button>${S.length > 1 ? '<button class="rm" type="button" data-qt="rm">Remove</button>' : ''}</div></fieldset>`).join('');
}
function draftField(e){
  const t = e.target, fs = t.closest('.qt-stop');
  if (!QDRAFT || !fs) return;
  if (t.name === 'qtNow'){ QDRAFT.current = t.value; return; }
  const s = QDRAFT.stops[+fs.dataset.i];
  if (t.dataset.f === 'goals') s.goals = t.value.split('\n'); else if (t.dataset.f) s[t.dataset.f] = t.value;
}
$('#questTools').addEventListener('input', draftField);
$('#questTools').addEventListener('change', draftField);
$('#questTools').addEventListener('click', e => {
  const b = e.target.closest('[data-qt]'); if (!b || !QDRAFT) return;
  const S = QDRAFT.stops, i = +b.closest('.qt-stop').dataset.i, a = b.dataset.qt;
  if (a === 'rm') return confirmRemove(b, () => { S.splice(i, 1); if (!S.some(s => s.id === QDRAFT.current)) QDRAFT.current = S[0].id; renderQuestEditor(); });
  const j = a === 'up' ? i - 1 : i + 1;
  if (!S[j]) return;
  [S[i], S[j]] = [S[j], S[i]]; renderQuestEditor();
  $(`.qt-stop[data-i="${j}"] [data-qt="${a}"]`)?.focus();
});
$('#qtAdd').addEventListener('click', () => {
  if (!QDRAFT) return;
  const S = QDRAFT.stops, st = $('#questStatus');
  if (S.length >= 20){ st.className = 'status err'; st.textContent = 'The roadmap can have up to 20 lessons.'; return; }
  const s = {id: newId(), week: S.length ? (parseInt(S[S.length - 1].week, 10) || 0) + 1 : 1, title: '', goals: [], link: ''};
  S.push(s); renderQuestEditor(); document.getElementById('qtt-' + s.id).focus();
});
$('#questLinkForm').addEventListener('submit', e => {
  e.preventDefault(); if (!TEACHER) return;
  const st = $('#questStatus'), url = $('#qtLink').value.trim();
  if (url && !safeUrl(url)){ st.className = 'status err'; st.textContent = 'The link must start with https://'; return; }
  save(st, d => { d.questLink = safeUrl(url); });
});
$('#questForm').addEventListener('submit', e => {
  e.preventDefault(); if (!TEACHER || !QDRAFT) return;
  const st = $('#questStatus'), fail = m => { st.className = 'status err'; st.textContent = m; };
  const ranks = $('#qtRanks').value.split(',').map(x => x.trim().slice(0, 24)).filter(Boolean);
  if (ranks.length < 2 || ranks.length > 8) return fail('Add between 2 and 8 ranks, separated by commas.');
  const stops = [];
  for (const [i, s] of QDRAFT.stops.entries()){
    const title = String(s.title || '').trim().slice(0, 60), link = String(s.link || '').trim(), week = parseInt(s.week, 10);
    const goals = (Array.isArray(s.goals) ? s.goals : []).map(g => String(g).trim().slice(0, 120)).filter(Boolean);
    if (!title) return fail(`Lesson ${i + 1} needs a title.`);
    if (!goals.length) return fail(`Add at least one skill to “${title}”.`);
    if (goals.length > 6) return fail(`“${title}” has ${goals.length} skills. Keep it to 6 or fewer.`);
    if (link && !safeUrl(link)) return fail(`The link for “${title}” must start with https://`);
    stops.push({id: s.id, week: week > 0 ? Math.min(week, 60) : i + 1, title, goals, link: safeUrl(link)});
  }
  const current = stops.some(s => s.id === QDRAFT.current) ? QDRAFT.current : stops[0].id;
  save(st, d => { d.quest = {title: $('#qtTitle').value.trim().slice(0, 40) || 'Art Quest', ranks, ending: $('#qtEnding').value.trim().slice(0, 200), current, stops}; });
});

/* edit mode: only people who can edit the page see the switch; it starts off, so a projected page shows the student view */
function setEditing(on){
  TEACHER = !!(on && CAN_EDIT);
  $('#slideTools').hidden = !TEACHER; $('#padletTools').hidden = !TEACHER; $('#questTools').hidden = !TEACHER;
  QDRAFT = null; renderQuestEditor();
  const b = $('#editToggle'); b.setAttribute('aria-pressed', TEACHER); b.textContent = TEACHER ? 'Edit mode: on' : 'Edit mode: off';
  try { sessionStorage.setItem('hub:editing', TEACHER ? '1' : '0'); } catch (e) {}
  renderSlides(); renderPadlets();
}
$('#editToggle').addEventListener('click', () => setEditing(!TEACHER));

/* teacher tools appear only for people who can edit this page */
(async () => {
  const cl = window.claude; if (!cl || !cl.use) return;
  const [user, art] = await Promise.all([cl.use('user'), cl.use('artifact')]);
  if (!user || !art) return;
  let canEdit = false; try { canEdit = await user.canEdit(); } catch (e) {}
  if (!canEdit) return;
  ART = art; CAN_EDIT = true;
  try { ASSETS = await cl.use('assets'); } catch (e) {}
  $('#pBoard').value = DATA.submitLink || ''; $('#qtLink').value = DATA.questLink || '';
  $('#editToggle').hidden = false;
  let on = false; try { on = sessionStorage.getItem('hub:editing') === '1'; } catch (e) {}
  setEditing(on);
  renderSlides(); renderPadlets();
})();
renderSlides(); renderPadlets(); renderQuest(); renderStop();
try { const to = sessionStorage.getItem('hub:scrollTo'); if (to){ sessionStorage.removeItem('hub:scrollTo'); setTimeout(() => document.getElementById(to)?.scrollIntoView(), 60); } } catch (e) {}
</script></body></html>
